<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leanerp Mobile</title>
<link rel="manifest" href="/manifest.json">
<script>window.frappe = window.frappe || {};</script>
<!-- csrf_token -->
<style>
  :root {
    --ink: #12181B;
    --sub: #6b7a7c;
    --line: #dbe3e2;
    --bg: #f4f6f5;
    --accent: #1e8e5a;
    --danger: #b23a3a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    color: var(--ink);
    background: #fff;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    position: relative;
    overflow: hidden;
  }
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.2rem 0.6rem;
  }
  header .icon-btn {
    width: 2.4rem; height: 2.4rem;
    border: none; background: var(--bg);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; cursor: pointer;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  header .title { font-size: 1.4rem; font-weight: 700; }
  header .greeting { font-size: 0.82rem; color: var(--sub); margin-bottom: 0.15rem; }
  header .icons { display: flex; gap: 0.5rem; }

  .search-bar {
    margin: 0.6rem 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg);
    border-radius: 10px;
    padding: 0.6rem 0.9rem;
  }
  .search-bar input {
    border: none; background: transparent; outline: none;
    font-size: 1rem; width: 100%; color: var(--ink);
  }

  .filter-row {
    display: flex; gap: 0.5rem;
    padding: 0.2rem 1.2rem 0.8rem;
    overflow-x: auto;
  }
  .chip {
    flex: none;
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .meta-row {
    padding: 0 1.2rem 0.4rem;
    color: var(--sub);
    font-size: 0.85rem;
  }

  #list {
    flex: 1;
    overflow-y: auto;
    padding: 0.2rem 1.2rem 6rem;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1rem;
    margin-bottom: 0.8rem;
    position: relative;
  }
  .card-top { display: flex; align-items: center; gap: 0.7rem; }
  .avatar {
    width: 2.6rem; height: 2.6rem;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem; color: #fff;
    flex: none;
  }
  .card-title { font-size: 1.1rem; font-weight: 700; flex: 1; }
  .call-btn {
    width: 2.3rem; height: 2.3rem;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    flex: none;
  }
  .card-phone { color: var(--sub); font-size: 0.9rem; margin: 0.4rem 0 0 3.3rem; }
  .card-row { font-size: 0.85rem; margin: 0.3rem 0 0 3.3rem; color: var(--ink); }
  .card-row .label { color: var(--sub); }
  .pill {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    margin: 0.4rem 0 0 3.3rem;
  }
  .overdue-tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--danger);
    background: #fbe4e4;
    padding: 0.1rem 0.5rem;
    border-radius: 6px;
    margin-left: 0.5rem;
    vertical-align: middle;
  }

  .fab button {
    width: 3.2rem; height: 3.2rem;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #fff;
    font-size: 1.6rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    cursor: pointer;
    position: absolute;
    right: 1.2rem;
    bottom: 5.2rem;
  }

  nav.tabs {
    display: flex;
    border-top: 1px solid var(--line);
    background: #fff;
    position: sticky;
    bottom: 0;
  }
  nav.tabs button {
    flex: 1;
    border: none;
    background: none;
    padding: 0.6rem 0 0.8rem;
    font-size: 0.75rem;
    color: var(--sub);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    cursor: pointer;
  }
  nav.tabs button.active { color: var(--ink); font-weight: 700; }
  nav.tabs .tab-icon { font-size: 1.2rem; }

  .empty-state {
    text-align: center;
    color: var(--sub);
    padding: 3rem 1rem;
    font-size: 0.9rem;
  }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    z-index: 50;
  }
  .overlay.open { display: block; }

  .sidebar {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 78%;
    max-width: 320px;
    background: #fff;
    z-index: 60;
    transform: translateX(-100%);
    transition: transform 0.2s ease;
    padding: 1.2rem;
    overflow-y: auto;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 { font-size: 1rem; letter-spacing: 0.05em; color: var(--sub); margin: 0 0 1rem; }
  .sidebar-item {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.7rem 0.4rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .sidebar-item.active { background: var(--bg); }
  .sidebar-item .folder-icon { color: var(--sub); }

  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    z-index: 60;
    border-radius: 16px 16px 0 0;
    padding: 1.2rem;
    transform: translateY(100%);
    transition: transform 0.2s ease;
    max-height: 85vh;
    overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem;
  }
  .sheet-header .title { font-size: 1.2rem; font-weight: 700; }
  .sheet-header button {
    border: none; background: none; font-size: 1.3rem; cursor: pointer; color: var(--sub);
  }
  .save-btn {
    border: none;
    background: var(--bg);
    color: var(--sub);
    padding: 0.4rem 1rem;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
  }
  .save-btn.ready { background: var(--ink); color: #fff; }
  .field-group { margin-bottom: 1rem; }
  .field-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--sub);
    margin-bottom: 0.3rem;
    font-weight: 600;
  }
  .field-group input {
    width: 100%;
    padding: 0.7rem 0.8rem;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 1rem;
    color: var(--ink);
    font-weight: 600;
  }

  .call-sheet-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.8rem 0.2rem;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
  }

  .toast {
    position: absolute;
    left: 50%; bottom: 6rem;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 0.6rem 1rem;
    border-radius: 999px;
    font-size: 0.85rem;
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <h2>SCREENS</h2>
    <div id="sidebar-list"></div>
  </aside>

  <div class="main">
    <header>
      <div class="header-left">
        <button class="icon-btn" id="menu-btn" aria-label="Menu">&#9776;</button>
        <div>
          <div class="greeting" id="greeting-sub">leanerp</div>
          <div class="title" id="greeting-name">&nbsp;</div>
        </div>
      </div>
      <div class="icons">
        <button class="icon-btn" id="bell-btn" aria-label="Notifications">&#128276;</button>
        <button class="icon-btn" id="logout-btn" aria-label="Logout">&#8618;</button>
      </div>
    </header>

    <div class="search-bar">
      <span>&#128269;</span>
      <input type="text" id="search-input" placeholder="Search…">
    </div>

    <div class="filter-row" id="filter-row"></div>
    <div class="meta-row" id="meta-row"></div>

    <div id="list"></div>

    <div class="fab">
      <button id="fab-btn" aria-label="Add">+</button>
    </div>

    <nav class="tabs">
      <button class="active" data-tab="home"><span class="tab-icon">&#8962;</span>Home</button>
      <button data-tab="tasks"><span class="tab-icon">&#10003;</span>Tasks</button>
      <button data-tab="profile"><span class="tab-icon">&#9787;</span>Profile</button>
    </nav>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="sheet" id="quick-edit-sheet"></div>
  <div class="sheet" id="call-sheet"></div>

  <div class="toast" id="toast"></div>

  <script src="/mobile.js"></script>
</body>
</html>
