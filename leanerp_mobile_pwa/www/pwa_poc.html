<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leanerp PWA POC</title>
<link rel="manifest" href="/manifest.json">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    color: #12181B;
  }
  h1 { font-size: 1.6rem; margin-bottom: 0.3rem; }
  p.sub { color: #6b7a7c; margin-top: 0; }
  .card {
    border: 1px solid #dbe3e2;
    border-radius: 10px;
    padding: 1rem 1.2rem;
    margin-top: 1.5rem;
    background: #f4f6f5;
  }
  .label {
    font-family: ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6b7a7c;
    margin-bottom: 0.4rem;
  }
  .value { font-size: 1.1rem; font-weight: 600; }
  .ok { color: #1e8e5a; }
  .err { color: #b23a3a; }
</style>
</head>
<body>

  <h1>Hello World</h1>
  <p class="sub">leanerp PWA POC — Stage 0 · leanerp_mobile_pwa</p>

  <div class="card">
    <div class="label">Session check — no login code written</div>
    <div class="value" id="result">checking…</div>
  </div>

  <script>
    // Plain fetch(), same-origin — the browser attaches the existing
    // session cookie automatically. No token, no OAuth, nothing built.
    fetch("/api/method/frappe.auth.get_logged_user", { method: "GET" })
      .then((r) => r.json())
      .then((data) => {
        const user = data.message;
        const el = document.getElementById("result");
        if (user && user !== "Guest") {
          el.textContent = "Logged in as: " + user;
          el.className = "value ok";
        } else {
          el.textContent = "Not logged in (Guest) — visit /login first";
          el.className = "value err";
        }
      })
      .catch((e) => {
        const el = document.getElementById("result");
        el.textContent = "Request failed: " + e;
        el.className = "value err";
      });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>

</body>
</html>
